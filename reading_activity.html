
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PufferFish - Reading Activity</title>
    <link rel="stylesheet" href="styles.css">
    <script src="ai_tools.js"></script>
</head>
<body>
    <header>
        <div class="logo">
            <img src="logo.png" alt="PufferFish Logo">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="reading_activity.html">Reading Activity</a></li>
                <li><a href="custom_text.html">Custom Text</a></li>
                <li><a href="progress_tracking.html">Progress Tracking</a></li>
            </ul>
        </nav>
    </header>
    <section id="activity">
        <h1>Reading Activity</h1>
        <p id="reading-text">The quick brown fox jumps over the lazy dog.</p>
        <div class="activity-controls">
            <button onclick="playTextToSpeech()">Play Text-to-Speech</button>
            <button onclick="startSpeechRecognition()">Speak</button>
            <button onclick="analyzePronunciation()">Analyze</button>
        </div>
        <div id="feedback">Feedback will appear here...</div>
    </section>
</body>
</html>
